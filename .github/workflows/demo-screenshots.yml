name: Synthetic app screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platforms
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug app
        run: ./gradlew :app:assembleDebug
      - name: Capture synthetic demo screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-boot-anim -no-audio -gpu swiftshader_indirect
          script: python3 .github/scripts/capture_demo_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: deg-messages-synthetic-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
