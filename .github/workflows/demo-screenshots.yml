name: Synthetic app screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download published universal APK
        run: |
          mkdir -p release
          curl --fail --location --retry 3 \
            https://github.com/orisakume/deg-messages/releases/download/v1.0.0/DEG-Messages-v1.0.0-universal.apk \
            --output release/DEG-Messages-v1.0.0-universal.apk
      - name: Capture synthetic demo screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-boot-anim -no-audio -gpu swiftshader_indirect
          script: python3 .github/scripts/capture_demo_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: deg-messages-synthetic-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
